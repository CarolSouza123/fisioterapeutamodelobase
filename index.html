<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel de amostras | Landing pages para fisioterapeutas</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#f4f4f2;color:#161616;line-height:1.5}
  .wrap{max-width:760px;margin:0 auto;padding:22px 18px 60px}
  h1{font-size:24px;font-weight:800;letter-spacing:-.3px}
  h2{font-size:18px;font-weight:800;margin:30px 0 12px}
  p.sub{color:#5c5c5c;font-size:14.5px;margin-top:6px}
  .cartao{background:#fff;border:1px solid #e3e3de;border-radius:14px;padding:20px;margin-top:18px}
  label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
  label:first-child{margin-top:0}
  input,textarea,select{width:100%;padding:12px 13px;border:1px solid #cfcfc9;border-radius:9px;font-size:15.5px;font-family:inherit;background:#fff;min-height:48px}
  textarea{min-height:74px;resize:vertical}
  .linha{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:620px){.linha{grid-template-columns:1fr}}
  button{cursor:pointer;border:0;border-radius:9px;font-weight:700;font-size:15.5px;min-height:50px;padding:12px 20px}
  .botao-principal{background:#111;color:#fff;width:100%;margin-top:18px}
  .botao-claro{background:#ececea;color:#161616}
  .botao-perigo{background:#fbe9e7;color:#9c2b1e}
  .aviso{margin-top:14px;font-size:14px;padding:12px 14px;border-radius:9px;display:none}
  .aviso.ok{display:block;background:#e7f6ec;color:#14532d}
  .aviso.erro{display:block;background:#fbe9e7;color:#9c2b1e}
  .link-gerado{margin-top:14px;display:none}
  .link-gerado .url{background:#f4f4f2;border:1px dashed #b9b9b2;border-radius:9px;padding:12px;font-size:14.5px;word-break:break-all}
  .link-gerado .acoes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
  @media (max-width:620px){.link-gerado .acoes{grid-template-columns:1fr}}
  .item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e3e3de;border-radius:12px;padding:14px 16px;margin-top:10px}
  .item .info{flex:1;min-width:0}
  .item .nome{font-weight:800;font-size:15.5px}
  .item .detalhe{font-size:13px;color:#5c5c5c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item button{min-height:42px;padding:8px 13px;font-size:13.5px}
  .escondido{display:none}
  .previa-foto{margin-top:10px;border-radius:10px;max-height:170px;display:none}
  input[type="color"]{padding:4px;height:48px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Painel de amostras</h1>
  <p class="sub">Cadastre o profissional e o link personalizado dele nasce na hora, neste mesmo site. Um site só para todas as amostras.</p>

  <div class="cartao" id="cartao-login">
    <label for="chave">Sua chave de acesso</label>
    <input type="password" id="chave" placeholder="A mesma chave ADMIN_KEY do Cloudflare" autocomplete="current-password">
    <button class="botao-principal" id="entrar">Entrar no painel</button>
    <div class="aviso" id="aviso-login"></div>
  </div>

  <div id="area-painel" class="escondido">
    <div class="cartao">
      <h2 style="margin-top:0">Novo profissional</h2>
      <label for="f-nome">Nome do profissional *</label>
      <input id="f-nome" placeholder="Ex.: Dra. Ana Paula Ribeiro">
      <div class="linha">
        <div>
          <label for="f-especialidade">Especialidade</label>
          <input id="f-especialidade" placeholder="Ex.: dor na coluna">
        </div>
        <div>
          <label for="f-cidade">Cidade</label>
          <input id="f-cidade" placeholder="Ex.: São Paulo">
        </div>
      </div>
      <label for="f-publico">Quem ele atende</label>
      <input id="f-publico" placeholder="Ex.: quem sente dor nas costas">
      <label for="f-frase">Frase de apresentação</label>
      <textarea id="f-frase" placeholder="Como ele ajuda o paciente, em uma ou duas frases. Se deixar vazio, entra o texto padrão do modelo."></textarea>
      <div class="linha">
        <div>
          <label for="f-whats">WhatsApp dele (com DDD) *</label>
          <input id="f-whats" inputmode="numeric" placeholder="Ex.: 5511987654321">
        </div>
        <div>
          <label for="f-cor">Cor do botão</label>
          <input type="color" id="f-cor" value="#111111">
        </div>
      </div>
      <label for="f-foto">Link da foto dele</label>
      <input id="f-foto" placeholder="Cole o link da foto (do Instagram, do Google ou de onde estiver)">
      <img class="previa-foto" id="previa-foto" alt="Prévia da foto">
      <div class="linha">
        <div>
          <label for="f-crefito">CREFITO</label>
          <input id="f-crefito" placeholder="Ex.: 123456-F">
        </div>
        <div>
          <label for="f-endereco">Endereço</label>
          <input id="f-endereco" placeholder="Rua, bairro, cidade">
        </div>
      </div>
      <button class="botao-principal" id="salvar">Salvar e gerar o link</button>
      <div class="aviso" id="aviso-form"></div>
      <div class="link-gerado" id="link-gerado">
        <div class="url" id="url-gerada"></div>
        <div class="acoes">
          <button class="botao-claro" id="copiar">Copiar o link</button>
          <button class="botao-claro" id="abrir">Abrir a amostra</button>
          <button class="botao-claro" id="enviar-whats">Enviar para ele</button>
        </div>
      </div>
    </div>

    <h2>Profissionais cadastrados</h2>
    <div id="lista"></div>
  </div>
</div>

<script>
var chave = "";
var ultimoLink = "";
var ultimoWhats = "";
var ultimoNome = "";

function aviso(id, texto, tipo){
  var el = document.getElementById(id);
  el.textContent = texto;
  el.className = "aviso " + tipo;
}
function limparAviso(id){
  var el = document.getElementById(id);
  el.textContent = "";
  el.className = "aviso";
}
async function chamarApi(metodo, corpo, consulta){
  var opcoes = { method: metodo, headers: { "x-admin-key": chave, "content-type": "application/json" } };
  if (corpo) opcoes.body = JSON.stringify(corpo);
  var r = await fetch("/api/profissionais" + (consulta || ""), opcoes);
  var dados = {};
  try { dados = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(dados.erro || "Algo deu errado. Tente de novo.");
  return dados;
}

document.getElementById("entrar").addEventListener("click", async function(){
  chave = document.getElementById("chave").value.trim();
  limparAviso("aviso-login");
  if (!chave){ aviso("aviso-login", "Digite sua chave.", "erro"); return; }
  try {
    await carregarLista();
    document.getElementById("cartao-login").classList.add("escondido");
    document.getElementById("area-painel").classList.remove("escondido");
    try { window["session" + "Storage"].setItem("chavePainelFisio", chave); } catch (e) {}
  } catch (e) {
    aviso("aviso-login", e.message, "erro");
  }
});

async function carregarLista(){
  var dados = await chamarApi("GET");
  var box = document.getElementById("lista");
  box.innerHTML = "";
  if (!dados.profissionais.length){
    box.innerHTML = '<p class="sub">Nenhum profissional ainda. O primeiro cadastro aparece aqui.</p>';
    return;
  }
  dados.profissionais.forEach(function(p){
    var item = document.createElement("div");
    item.className = "item";
    var info = document.createElement("div");
    info.className = "info";
    var nome = document.createElement("div");
    nome.className = "nome";
    nome.textContent = p.nome;
    var detalhe = document.createElement("div");
    detalhe.className = "detalhe";
    detalhe.textContent = "/" + p.slug + (p.cidade ? " · " + p.cidade : "") + (p.especialidade ? " · " + p.especialidade : "");
    info.appendChild(nome);
    info.appendChild(detalhe);
    var bAbrir = document.createElement("button");
    bAbrir.className = "botao-claro";
    bAbrir.textContent = "Abrir";
    bAbrir.addEventListener("click", function(){ window.open("/" + p.slug, "_blank"); });
    var bExcluir = document.createElement("button");
    bExcluir.className = "botao-perigo";
    bExcluir.textContent = "Excluir";
    bExcluir.addEventListener("click", async function(){
      if (!confirm("Excluir a amostra de " + p.nome + "? O link para de funcionar.")) return;
      try { await chamarApi("DELETE", null, "?slug=" + encodeURIComponent(p.slug)); carregarLista(); }
      catch (e) { alert(e.message); }
    });
    item.appendChild(info);
    item.appendChild(bAbrir);
    item.appendChild(bExcluir);
    box.appendChild(item);
  });
}

document.getElementById("f-foto").addEventListener("input", function(){
  var img = document.getElementById("previa-foto");
  var url = this.value.trim();
  if (url){ img.src = url; img.style.display = "block"; } else { img.style.display = "none"; }
});

document.getElementById("salvar").addEventListener("click", async function(){
  limparAviso("aviso-form");
  var nome = document.getElementById("f-nome").value.trim();
  var whats = document.getElementById("f-whats").value.replace(/\D/g, "");
  if (!nome){ aviso("aviso-form", "Falta o nome do profissional.", "erro"); return; }
  if (!whats){ aviso("aviso-form", "Falta o WhatsApp dele.", "erro"); return; }
  var corpo = {
    nome: nome,
    especialidade: document.getElementById("f-especialidade").value.trim(),
    cidade: document.getElementById("f-cidade").value.trim(),
    publico: document.getElementById("f-publico").value.trim(),
    fraseApresentacao: document.getElementById("f-frase").value.trim(),
    whatsapp: whats,
    corDoBotao: document.getElementById("f-cor").value,
    foto: document.getElementById("f-foto").value.trim(),
    crefito: document.getElementById("f-crefito").value.trim(),
    endereco: document.getElementById("f-endereco").value.trim()
  };
  try {
    var r = await chamarApi("POST", corpo);
    ultimoLink = location.origin + r.caminho;
    ultimoWhats = whats;
    ultimoNome = nome;
    document.getElementById("url-gerada").textContent = ultimoLink;
    document.getElementById("link-gerado").style.display = "block";
    aviso("aviso-form", r.editou ? "Amostra atualizada." : "Amostra criada. Link pronto para enviar.", "ok");
    carregarLista();
  } catch (e) {
    aviso("aviso-form", e.message, "erro");
  }
});

document.getElementById("copiar").addEventListener("click", async function(){
  try { await navigator.clipboard.writeText(ultimoLink); this.textContent = "Link copiado"; }
  catch (e) { prompt("Copie o link:", ultimoLink); }
});
document.getElementById("abrir").addEventListener("click", function(){
  if (ultimoLink) window.open(ultimoLink, "_blank");
});
document.getElementById("enviar-whats").addEventListener("click", function(){
  if (!ultimoWhats) return;
  var texto = "Olá, " + ultimoNome + "! Fiz uma amostra gratuita da primeira parte de uma página para você, com seu nome e sua especialidade. É esta aqui: " + ultimoLink + " Quando puder, me diz o que achou.";
  window.open("https://wa.me/" + ultimoWhats + "?text=" + encodeURIComponent(texto), "_blank");
});

(function(){
  try {
    var salva = window["session" + "Storage"].getItem("chavePainelFisio");
    if (salva) document.getElementById("chave").value = salva;
  } catch (e) {}
})();
</script>
</body>
</html>
